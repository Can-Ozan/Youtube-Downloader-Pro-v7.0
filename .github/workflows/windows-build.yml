name: Windows x64 distribution

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Verify release tag matches the single version source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "import os, runpy; v=runpy.run_path('youtube_downloader_pro/__init__.py')['__version__']; assert os.environ['GITHUB_REF_NAME'] == 'v'+v, 'Tag does not match package version'"
          if ($LASTEXITCODE -ne 0) { throw 'Version mismatch' }
      - name: Install FFmpeg for integration tests only
        run: choco install ffmpeg --no-progress -y
      - name: Create isolated build environment
        run: python -m venv .venv
      - name: Test, lint, build ONEDIR and validate packaged startup
        run: ./scripts/build_windows.ps1 -InstallDependencies
      - name: Package validated runtime and checksum
        run: ./scripts/package_release.ps1
      - name: Upload Windows test artifacts (does not publish a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            release/*.zip
            release/*.sha256
            release/*.validation.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-diagnostics-${{ github.run_number }}
          path: |
            build/.work/*.json
            build/.work/packaged-smoke-data/logs/*
            build/.work/windows/warn-*.txt
          if-no-files-found: ignore
          retention-days: 7
